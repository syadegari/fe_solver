[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-solver"
version = "0.1.0"
description = "Finite-strain Hex8, Hex8-Fbar, and Hex20 finite-element prototype"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gmsh>=4.11",
    "h5py>=3.11",
    "threadpoolctl>=3.6",
    "numba>=0.67,<0.68",
]

[project.scripts]
fe-solver = "fe_solver.cli:main"

[project.optional-dependencies]
test = ["matplotlib>=3.8", "coverage>=7.13,<8"]

[tool.coverage.run]
source = ["fe_solver"]
branch = true
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
include = ["fe_solver*"]
