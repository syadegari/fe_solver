[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-solver"
version = "0.1.0"
description = "Finite-strain Hex8, Hex8-Fbar, and Hex20 finite-element prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "gmsh>=4.11", "h5py>=3.11", "threadpoolctl>=3.6"]

[project.optional-dependencies]
j2-jit = ["numba>=0.67,<0.68"]

[project.scripts]
fe-solver = "fe_solver.cli:main"

[tool.setuptools.packages.find]
include = ["fe_solver*"]
