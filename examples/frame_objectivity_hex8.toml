[[materials]]
name = "bar"
model = "neo_hook"
[materials.properties]
mu = 1.0
kappa = 20.0

[[element_assignments]]
region = "solid"
formulation = "hex8"
material = "bar"

[[constraints.affine]]
name = "stretch_then_rotate"
regions = ["xmin", "xmax", "ymin", "ymax", "zmin", "zmax"]
origin = [0.0, 0.0, 0.0]
macro_F = [
  [{curve = "f11"}, {curve = "f12"}, {constant = 0.0}],
  [{curve = "f21"}, {curve = "f22"}, {constant = 0.0}],
  [{constant = 0.0}, {constant = 0.0}, {constant = 1.0}]
]

[output]
directory = "results/frame_objectivity_hex8"
interval = 0.05
explicit_times = [0.1, 1.0]
database = "run.h5"
history_file = "run_log.json"

[restart]
enabled = false
keep_last = 0
restart_from = ""

[verification]
require_positive_J = true
check_global_force_balance = true
affine_deformation = true
affine_tolerance = 1.0e-9
