[analysis]
name = "frame_objectivity_hex8"
t_start = 0.0
t_end = 1.0

[mesh]
file = "elongated_hex8.msh"
format = "gmsh_msh41"

[time]
dt_initial = 0.05
dt_min = 1.0e-5
dt_max = 0.05
cutback_factor = 0.5
growth_factor = 1.25
grow_if_newton_iterations_le = 4
max_attempts_per_increment = 14

[nonlinear]
method = "newton"
max_iterations = 24
force_rtol = 1.0e-8
force_atol = 1.0e-10
constraint_rtol = 1.0e-10
constraint_atol = 1.0e-12
check_displacement_increment = true
displacement_rtol = 1.0e-10
displacement_atol = 1.0e-12

[linear_solver]
backend = "scipy_splu"
ordering = "COLAMD"
singular_policy = "diagnose_and_abort"

