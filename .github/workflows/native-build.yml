name: Native build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superlu-mt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake build-essential libglu1-mesa
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Configure SuperLU_MT bridge
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -Denable_internal_blaslib=ON
          -DTHREAD_API=PTHREAD
          -DPLAT=_PTHREAD
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run upstream tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Test bridge against SciPy
        run: |
          test -s build/native/libsuperlu_mt_bridge.so
          python -m unittest discover -s tests -p test_linear_solver.py -v
